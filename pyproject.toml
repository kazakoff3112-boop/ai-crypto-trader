[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-crypto-trader"
version = "0.1.0"
description = "Safety-first crypto research, offline backtesting and order-free shadow trading"
requires-python = ">=3.9"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
